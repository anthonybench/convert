[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "sleepyconvert"
version = "2.3.3"
description = "Convert data files, images, and documents between formats from a single terse CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["pandas", "data", "documents", "images", "converter", "cli"]
authors = [{ name = "Isaac Yep", email = "anthonybenchyep@gmail.com" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Text Processing :: Markup",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "beautifulsoup4>=4.12.0",
  "markdown>=3.7",
  "markdownify>=0.13.1",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
  "pillow>=11.0.0",
  "pyarrow>=18.0.0",
  "pypdf>=5.0.0",
  "pyyaml>=6.0",
  "reportlab>=4.2.0",
  "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.10.0",
  "pytest>=8.3.0",
  "shfmt-py>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/anthonybench/convert"
Documentation = "https://github.com/anthonybench/convert#readme"
Source = "https://github.com/anthonybench/convert"
Issues = "https://github.com/anthonybench/convert/issues"
Changelog = "https://github.com/anthonybench/convert/releases"

[project.scripts]
sleepyconvert = "sleepyconvert.main:run"

[tool.poetry]
packages = [{ include = "sleepyconvert" }]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "*.py"
